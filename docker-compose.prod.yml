version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mswater-db-prod
    restart: always
    environment:
      POSTGRES_DB: mswater
      POSTGRES_USER: mswater
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mswater_secure_pwd_2026}
    volumes:
      - mswater_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mswater -d mswater"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mswater-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://db:5432/mswater
      - DATABASE_USERNAME=mswater
      - DATABASE_PASSWORD=${DB_PASSWORD:-mswater_secure_pwd_2026}
      - JWT_SECRET=${JWT_SECRET:-mySuperSecureProductionJwtSecretKeyForMSWaterSuppliers2026App}
      - CORS_ORIGINS=*
    ports:
      - "8080:8080"

  # 3. Nginx + React Frontend (PWA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mswater-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mswater_pgdata:
