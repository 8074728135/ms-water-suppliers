version: '3.8'

services:
  # PostgreSQL for local development
  db:
    image: postgres:16-alpine
    container_name: mswater-db
    environment:
      POSTGRES_DB: mswater
      POSTGRES_USER: mswater
      POSTGRES_PASSWORD: mswater123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
